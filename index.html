<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamiltonyan8の数学資料集</title>
    <style>
        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            color: #333;
        }
        header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
            /* フレックスボックスでヘッダーを横並びに */
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-content {
            flex-grow: 1;
            text-align: center;
            padding: 0 15px;
        }
        /* 猫のGIF画像のスタイル */
        .cat-gif {
            width: 70px;
            height: auto;
        }
        /* 左側の猫 */
        .cat-left {
            transform: scaleX(1); /* 必要に応じて左右反転 */
        }
        h1 {
            color: #2c3e50;
            margin-top: 0;
        }
        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-top: 40px;
        }
        .list-section {
            margin-top: 30px;
        }
        .list-item {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px dashed #eee;
        }
        .item-title {
            font-size: 1.1em;
            font-weight: bold;
        }
        .item-description {
            font-size: 0.9em;
            color: #666;
            margin: 5px 0;
        }
        footer {
            margin-top: 50px;
            text-align: center;
            font-size: 0.9em;
            color: #7f8c8d;
        }
        a {
            color: #3498db;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        
        /* レスポンシブ対応 */
        @media (max-width: 600px) {
            .cat-gif {
                width: 50px; /* 小さい画面では猫を小さく */
            }
            h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <header>
        <!-- 左側の猫GIF -->
        <img src="images/math-cat-left.gif" alt="左側の数学する猫" class="cat-gif cat-left">
        
        <!-- ヘッダーのタイトル部分 -->
        <div class="header-content">
            <h1>Hamiltonyan8の資料集</h1>
            <p>数学や物理に関する資料やリンクを公開しています</p>
        </div>
        
        <!-- 右側の猫GIF -->
        <img src="images/math-cat-right.gif" alt="右側の数学する猫" class="cat-gif">
    </header>

    <main>
        <div class="list-section">
            <h2>数学資料 (PDF)</h2>
            <!-- PDFへのリンク例 -->
            <div class="list-item">
                <div class="item-title"><a href="pdfs/marsden_ratiu_liegroup.pdf">Lie群の初歩</a></div>
                <div class="item-description">常微分方程式の解法と応用例について解説しています。</div>
            </div>
            
            <div class="list-item">
                <div class="item-title"><a href="pdfs/sample2.pdf">線形代数学入門</a></div>
                <div class="item-description">ベクトル空間と線形変換の基本概念について説明しています。</div>
            </div>
            
            <div class="list-item">
                <div class="item-title"><a href="pdfs/sample3.pdf">群論の基礎</a></div>
                <div class="item-description">抽象代数学における群の定義と性質についてまとめています。</div>
            </div>
        </div>

        <div class="list-section">
            <h2>リンク集</h2>
            <div class="list-item">
                <div class="item-title"><a href="study-links.html">外部リンクや勉強したいことリスト</a></div>
                <div class="item-description">興味のある分野や参考サイトをまとめています。</div>
            </div>
        </div>

        <div class="list-section">
            <h2>外部リンク</h2>
            <div class="list-item">
                <div class="item-title"><a href="https://palaisblanc.at-ninja.jp/index.html" target="_blank" rel="noopener noreferrer">白の宮殿</a></div>
                <div class="item-description">管理人様が作成された数学や物理に関する情報サイトです。</div>
            </div>
            <!-- 他の外部リンクもここに追加できます -->
        </div>
    </main>
    
    <footer>
        <p>© 2025 Hamiltonyan8</p>
    </footer>
</body>
</html>
