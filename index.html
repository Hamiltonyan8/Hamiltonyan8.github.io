<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamiltonyan8の数学資料集</title>
    <style>
        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            color: #333;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        h1 {
            color: #2c3e50;
        }
        .pdf-list {
            margin-top: 30px;
        }
        .pdf-item {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px dashed #eee;
        }
        .pdf-title {
            font-size: 1.1em;
            font-weight: bold;
        }
        .pdf-description {
            font-size: 0.9em;
            color: #666;
            margin: 5px 0;
        }
        footer {
            margin-top: 50px;
            text-align: center;
            font-size: 0.9em;
            color: #7f8c8d;
        }
        a {
            color: #3498db;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1>Hamiltonyan8の数学資料集</h1>
        <p>数学に関するPDF資料を公開しています</p>
    </header>

    <main>
        <div class="pdf-list">
            <!-- PDFへのリンク例 -->
            <div class="pdf-item">
                <div class="pdf-title"><a href="pdfs/sample1.pdf">微分方程式の基礎</a></div>
                <div class="pdf-description">常微分方程式の解法と応用例について解説しています。</div>
            </div>
            
            <div class="pdf-item">
                <div class="pdf-title"><a href="pdfs/sample2.pdf">線形代数学入門</a></div>
                <div class="pdf-description">ベクトル空間と線形変換の基本概念について説明しています。</div>
            </div>
            
            <div class="pdf-item">
                <div class="pdf-title"><a href="pdfs/sample3.pdf">群論の基礎</a></div>
                <div class="pdf-description">抽象代数学における群の定義と性質についてまとめています。</div>
            </div>
            
            <!-- 必要に応じてリンクを追加 -->
        </div>
    </main>
    
    <footer>
        <p>© 2025 Hamiltonyan8</p>
    </footer>
</body>
</html>
